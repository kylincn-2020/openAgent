# DevOps Agent Configuration Example
# Copy this file to ~/config/devops-agent/config.yaml

# LLM Provider Configuration
llm:
  # Provider: claude, openai, or custom
  provider: claude

  # API Key for the selected provider
  api_key: your-api-key-here

  # Model to use
  # - Claude: claude-3-5-sonnet-20241022, claude-3-opus-20240229
  # - OpenAI: gpt-4, gpt-3.5-turbo
  # - Custom: depends on your endpoint
  model: claude-3-5-sonnet-20241022

  # Custom API endpoint (only required for provider: custom)
  # base_url: https://api.example.com/v1

  # Optional: Maximum retries for API calls (0-10)
  max_retries: 3

  # Optional: Timeout in seconds
  timeout: 30

# Logging Configuration
log_level: INFO
verbose: false
